[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "refactor-anything"
version = "0.1.0"
description = "Lock what your Python code does, let a coding agent refactor it, and prove nothing changed: record real calls, replay them after every edit, score the lock with mutants, and block Claude Code from stopping while behaviour differs. Zero dependencies."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Prime-agentai" }]
keywords = ["refactoring", "characterization-tests", "golden-master", "regression-testing", "record-replay", "mutation-testing", "ai-agents", "coding-agents", "claude-code", "codex", "python"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Testing",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "mypy>=1.8"]

[project.scripts]
refactor-anything = "refactor_anything.cli:main"

[project.urls]
Homepage = "https://github.com/Prime-agentai/refactor-anything"
Issues = "https://github.com/Prime-agentai/refactor-anything/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
refactor_anything = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "tests"]

[tool.mypy]
strict = true
files = ["src"]
